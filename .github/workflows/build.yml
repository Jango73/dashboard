name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check launcher script
        run: bash -n dashboard.sh

      - name: Check engine scripts
        run: |
          node --check dashboard.mjs
          node --check dashboard-ext.mjs
